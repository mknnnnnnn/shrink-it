name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: test
      ALGORITHM: HS256
      SECRET: test-secret
      ACCESS_TOKEN_EXPIRE: "30"
      BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: pytest
